name: Build Windows executable

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install pywebview==6.2.1 pyinstaller==6.22.3

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean "PS5 EXE Toolkit.spec"

      - name: Generate build timestamp
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M_UTC')" >> "$GITHUB_ENV"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PS5-EXE-Toolkit-windows_${{ env.BUILD_TIMESTAMP }}
          path: dist/PS5 EXE Toolkit.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ github.sha }}
          name: PS5 EXE Toolkit [Build ${{ env.BUILD_TIMESTAMP }}]
          target_commitish: ${{ github.sha }}
          files: dist/PS5 EXE Toolkit.exe
